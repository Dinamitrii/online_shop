---
deployment:
  tasks:
    - |
      set -eu
      APP_ROOT="/home/ejelezar/hardware_store"
      APP_PYTHON="/home/ejelezar/virtualenv/hardware_store/3.12/bin/python"

      test -d "$APP_ROOT"
      test -x "$APP_PYTHON"
      test -f app.py
      test -f courier_exports.py
      command -v rsync >/dev/null

      "$APP_PYTHON" -m pip install -r requirements.txt
      "$APP_PYTHON" -c 'import flask, flask_sqlalchemy, dotenv, docx, openpyxl'

      # Обновява кода, като запазва данните и настройките.
      rsync -a app.py models.py courier.py econt.py courier_exports.py passenger_wsgi.py wsgi.py requirements.txt "$APP_ROOT/"
      rsync -a templates/ "$APP_ROOT/templates/"
      rsync -a --exclude='/img/products/' --exclude='/img/categories/' static/ "$APP_ROOT/static/"

      /bin/mkdir -p "$APP_ROOT/tmp"
      /bin/touch "$APP_ROOT/tmp/restart.txt"