---
deployment:
  tasks:
    # ЗАМЕНИ с реалния абсолютен път до Application root
    # (същата папка, която си въвел/а в Setup Python App).
    # Пример: /home/твоя_cpanel_user/hardware_store
    - export DEPLOYPATH=/home/USERNAME/PATH_TO_APP

    # Инсталира/обновява Python зависимостите от requirements.txt
    # във virtualenv-а на приложението (пътят също идва от Setup Python App
    # страницата, секция "Enter to the virtual environment").
    - /home/USERNAME/virtualenv/PATH_TO_APP/3.x/bin/pip install -r $DEPLOYPATH/requirements.txt

    # Принуждава Passenger да рестартира приложението и да зареди новия код
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt
