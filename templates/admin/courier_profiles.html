<div id="sender-profiles" data-url="{{ url_for('courier_profiles') }}" data-mode="{{ profile_mode }}" {% if profile_mode == 'pickup' %}data-sender="{{ original.senderClient.name }}"{% endif %}>
<button class="btn btn-secondary" id="load-profiles" type="button">Зареди подателя от Еконт</button>
<p id="profiles-status" role="status">Заредете профилите от свързания акаунт в Еконт и изберете подател.</p>
<label for="profile-select">Профил в Еконт</label><select id="profile-select" disabled><option value="">Изберете профил</option></select>
<label for="profile-address">Запазен адрес в Еконт</label><select id="profile-address" disabled><option value="">Изберете адрес</option></select>
</div>
<script src="{{ url_for('static', filename='js/courier_profiles.js', v='2') }}" defer></script>
