<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Печат на товарителница {{ shipment.shipment_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/order_print.css') }}">
</head>
<body>
<nav class="print-toolbar">
    <strong>Товарителница № {{ shipment.shipment_number }}</strong>
    <button type="button" id="print-waybill" disabled>Печат на товарителницата</button>
    <a target="_blank" rel="noopener" href="{{ url_for('courier_print_pdf', order_id=shipment.order_id) }}">Отвори PDF отделно</a>
    <a href="{{ url_for('courier_order', order_id=shipment.order_id) }}">Към пратката</a>
</nav>
<p class="print-help" id="print-help" role="status">Изчакайте документът да се появи, после натиснете „Печат на товарителницата“ и изберете принтер.{% if shipment.environment == 'test' %} Това е тестова товарителница.{% endif %}</p>
<iframe class="pdf-frame" id="waybill-pdf" title="Товарителница на Еконт" src="{{ url_for('courier_print_pdf', order_id=shipment.order_id) }}"></iframe>
<script src="{{ url_for('static', filename='js/courier_print.js') }}" defer></script>
</body>
</html>
