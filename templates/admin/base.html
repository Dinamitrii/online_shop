<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Админ панел{% endblock %} · Железария Дианабад</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=PT+Sans:wght@400;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}?v={{ asset_version }}">

    <link type="text/css" rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"/>

    <link rel="apple-touch-icon" sizes="180x180"
          href="{{ url_for('static', filename='img/favicon/apple-touch-icon.png') }}"/>
    <link rel="icon" type="image/png" sizes="32x32"
          href="{{ url_for('static', filename='img/favicon/favicon-32x32.png') }}"/>
    <link rel="icon" type="image/png" sizes="16x16"
          href=" {{ url_for('static', filename='img/favicon/favicon-16x16.png') }}"/>
    <link rel="manifest" href="{{ url_for('static', filename='img/favicon/site.webmanifest') }}"/>
    <link rel="mask-icon"
          href="{{ url_for('static', filename='img/favicon/safari-pinned-tab.svg', color='#5bbad5') }}"/>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon/favicon.ico') }}"/>

    <meta name="msapplication-TileColor" content="#00aba9"/>
    <meta name="msapplication-config" content="static/img/favicon/browserconfig.xml"/>
    <meta name="theme-color" content="#ffffff"/>

</head>
<body class="admin-body">

<header class="admin-topbar">
    <a href="{{ url_for('admin_dashboard') }}" class="brand">🔧 Админ панел</a>
    <nav class="admin-nav">
        <a href="{{ url_for('admin_dashboard') }}">Продукти</a>
        <a href="{{ url_for('admin_categories') }}">Категории</a>
        <a href="{{ url_for('admin_orders') }}">Поръчки</a>
        <a href="{{ url_for('index') }}" target="_blank">Виж магазина ↗</a>
    </nav>
    <a href="{{ url_for('admin_logout') }}" class="admin-logout">Изход</a>
</header>

<main class="admin-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="flash-container">
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</main>

</body>
</html>
