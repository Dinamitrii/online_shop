deployment:
  tasks:
    # Реалната папка на живото приложение (Passenger Application Root).
    - export DEPLOYPATH=/home/ejelezar/hardware_store

    # Копира кода от git checkout-а към живата папка, но НИКОГА не пипа:
    #   - store.db / store.db.bak  (реалната база данни с продукти/поръчки)
    #   - .env                      (паролата и другите тайни настройки на живо)
    #   - static/img/products/      (реално качени снимки на продукти)
    #   - category-order.json       (подредбата на категориите, запазена от админа)
    # Така git push никога не може да презапише жива информация.
    - /bin/mkdir -p $DEPLOYPATH
    - >
      rsync -a --delete
      --exclude='.git'
      --exclude='store.db'
      --exclude='store.db.bak'
      --exclude='.env'
      --exclude='static/img/products/'
      --exclude='category-order.json'
      --exclude='hardware_store.bak'
      --exclude='online-shop-categories-update'
      --exclude='*.zip'
      --exclude='tmp'
      ./ $DEPLOYPATH/

    # Инсталира/обновява Python зависимостите от requirements.txt
    # във virtualenv-а на приложението.
    - /home/ejelezar/virtualenv/hardware_store/3.13/bin/pip install -r $DEPLOYPATH/requirements.txt

    # Принуждава Passenger да рестартира приложението и да зареди новия код
    - /bin/mkdir -p $DEPLOYPATH/tmp
    - /bin/touch $DEPLOYPATH/tmp/restart.txt